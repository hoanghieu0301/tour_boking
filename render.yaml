services:
  - type: web
    name: tour-booking-api
    env: node
    plan: free
    region: singapore
    buildCommand: npm install && npm run prisma:generate && npm run build
    startCommand: npm run start
    envVars:
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: API_PUBLIC_URL
        sync: false
      - key: USER_APP_PUBLIC_URL
        sync: false
